# -- general settings
general {
    # avoid starting multiple hyprlock instances
    # --config: passes the config file to use
    lock_cmd = pidof hyprlock || hyprlock --config ~/.config/hypr/ui/lock/hyprlock.conf


    # lock before suspend
    before_sleep_cmd = loginctl lock-session
    
    # to avoid having to press a key twice turn on the display
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    
    # automatically hold off your system from going into full hardware suspend or sleep until it detects that hyprlock has successfully finished drawing and locked  the screen.
    # inhibit_sleep = 2
    
    # basically, don't lock the screen while another events are happening
    ignore_dbus_inhibit = false
}

# -- to dim screen
listener {
    timeout = 60
    on-timeout = brightnessctl -s set 10    # set monitor backlight to minimum
    on-resume = brightnessctl -r # monitor backlight restore
}

# -- Turn off keyboard backlight
#listener {
#    timeout = 150
#    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
#    on-resume = brightnessctl -rd rgb:kbd_backlight
#}

# -- to lock screen
listener {
    timeout = 300   # 5min
    on-timeout = loginctl lock-session  # lock screen when timeout has passed
}

# -- to turn off the monitor
listener {
    timeout = 900 # 15min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'     # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl --restore # screen on when activity is detected after timeout has fired
}

# -- to suspend pc
listener {
    timeout = 1200  # 20min
    on-timeout = systemctl suspend  # suspend pc
}

