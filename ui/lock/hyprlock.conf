general {
    hide_cursor     = false
    text_trim       = true
    screencopy_mode = 0
    fail_timeout    = 60000
}

animations {
    enabled = true
}

background {
    monitor =
    path=/home/$USER/Pictures/wallpapers/default_mac_os_wallpaper.jpg
    color=rgba(17, 17, 17, 1.0)
    blur_passes=3
    blur_size=7
    noise=0.0117
    brightness=0.545
    crossfade=0.5
}

input-field {
    monitor=
    
    size=300,50
    
    outline_thickness=4
    
    dots_size=0.33
    dots_spacing=0.15
    dots_center=true
    dots_rounding=10

    outer_color=rgba(17, 17, 17, 1.0)
    inner_color=rgba(0, 0, 0, 0.0)

    font_color=rgba(10, 10, 10, 1.0)
    font_family=JetBrainsMono Nerd Font
    
    placeholder_text=<i>password...</i>
    fail_text=<i>$FAIL... Failed attempts: <b>$ATTEMPTS</b></i>

    position=0, -20

    halign=center
    valign=center
    
    check_color=rgba(204, 136, 34, 1.0)

    fade_on_empty = false
}

# clock and date
label {
    monitor =
    
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    
    color = rgba(216, 222, 233, 0.90)
    
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    
    position = 0, 150
    halign = center
    valign = center
}
