# Global Settings
splash      = false
ipc         = true

# main screen
wallpaper {
    monitor     = eDP-1
    fit_mode    = fill  # options are: contain, cover, tile, fill
    path        = /home/pictures/hyprland_wallpaper/dont_look_at_me.jpg
    #timeout     = 120 # seconds
    #order       = random
    recursive   = false
}

# anything connect into HDMI
wallpaper {
    monitor     = HDMI-A-1
    fit_mode    = cover
    path        = /home/pictures/hyprland_wallpaper/11-0-Color-Day.jpg
    recursive   = false
    # timeout     = 30   # seconds
} 

# fallback
wallpaper {
    monitor     =
    path        = /home/pictures/hyprland_wallpaper/15-Sequoia-Sunrise.png
    fit_mode    = cover
}

# use listactive to print currently active wallpaper for each monitor, for example:
# hyprctl hyprpaper listactive
# HDMI-A-1: /home/user/wallpaper.jpg
# eDP-1: /home/user/wallpaper.png
